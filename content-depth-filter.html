<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strict Content Strategist Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1f2937;
      --bg-gradient-end: #111827;
      --card-bg: rgba(31, 41, 55, 0.5);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-heading: #ffffff;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #34d399;
      --input-bg: #374151;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 850px; width: 100%; margin: 0 auto; flex-grow: 1; }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.5rem; font-weight: 700; color: var(--text-heading); letter-spacing: -1px; margin-bottom: 10px; }
    p.subtitle { font-size: 1.1rem; color: var(--text-secondary); }
    
    .prompt-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    .label-tag {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* Input Field */
    textarea#ideaInput {
      width: 100%;
      min-height: 140px;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      margin-bottom: 25px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea#ideaInput:focus { border-color: var(--accent-primary); }

    /* Preview Box */
    .prompt-preview {
      background-color: var(--code-bg);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      margin-bottom: 25px;
      max-height: 400px;
      overflow-y: auto;
    }

    /* Copy Button */
    .copy-button {
      align-self: flex-end;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--bg-gradient-end);
      background-color: var(--accent-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .copy-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    .copy-button.copied {
      background-color: var(--accent-success);
    }
    .icon { width: 20px; height: 20px; }
    .copied-icon { display: none; }
    .copy-button.copied .copy-icon { display: none; }
    .copy-button.copied .copied-icon { display: inline-block; }

    footer { padding: 40px 0; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Anti-Hype Strategist</h1>
      <p class="subtitle">Evaluate and refine your content ideas for depth and orientation.</p>
    </header>

    <main>
      <div class="prompt-card">
        
        <label class="label-tag" for="ideaInput">1. Content Idea Input:</label>
        <textarea id="ideaInput" placeholder="Paste your content idea or rough notes here..."></textarea>

        <label class="label-tag">2. Generated Prompt (Live Preview):</label>
        <div id="fullPromptPreview" class="prompt-preview"></div>

        <button class="copy-button" id="copyBtn">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span id="btnText">Copy Full Evaluation Prompt</span>
        </button>
      </div>
    </main>

    <footer>
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const ideaInput = document.getElementById('ideaInput');
    const fullPromptPreview = document.getElementById('fullPromptPreview');
    const copyBtn = document.getElementById('copyBtn');
    const btnText = document.getElementById('btnText');

    const strategistTemplate = `ROLE
You are a strict, non-performative content strategist whose only job is to protect an orientation-first, anti-hype writing system.
You do not optimize for popularity, engagement, or monetization.
You care only about depth, coherence, and reader orientation.

TASK
I will give you one content idea.
Your task is to:
1. Evaluate whether this idea is aligned or shallow based on the criteria below
2. Score it using the provided scoring system
3. If shallow, rewrite it into an aligned idea without adding tactics, hype, or “depth theater”

NON-NEGOTIABLE CONSTRAINTS
● Do NOT praise the idea
● Do NOT soften criticism
● Do NOT add advice, steps, frameworks, or promises
● Do NOT turn it into a how-to
● Do NOT introduce future payoff (“we’ll explore later”)
● Do NOT increase complexity for the sake of sounding deep
The rewrite must:
● Remove false assumptions
● Increase orientation
● Stay calm and complete
● Stand alone

STEP 1: DEPTH FILTER (YES / NO ONLY)
1. Does the idea name a lived confusion (not a topic or opinion)?
2. Does it remove a false assumption rather than add advice?
3. Can it stand alone without requiring continuation?
4. Does it calm or steady the reader rather than energize or provoke?
5. Can it be written without using “should,” “must,” “optimize,” “win,” or “leverage”?
6. Would this idea still be worth writing even if no one reacted to it?

STEP 2: SCORING SYSTEM (Score 0–6)
STEP 3: DIAGNOSIS (BRIEF, MERCILESS)
STEP 4: REWRITE (ONLY IF SCORE ≤ 4)
STEP 5: FINAL LITMUS CHECK

CONTENT IDEA TO EVALUATE:
`;

    function updateDisplay() {
      const userIdea = ideaInput.value.trim() || "[PASTE CONTENT IDEA HERE]";
      fullPromptPreview.textContent = strategistTemplate + userIdea;
    }

    // Initialize display and listener
    ideaInput.addEventListener('input', updateDisplay);
    updateDisplay();

    // Copy Logic
    copyBtn.addEventListener('click', () => {
      const finalPrompt = fullPromptPreview.textContent;
      
      navigator.clipboard.writeText(finalPrompt).then(() => {
        const originalLabel = btnText.textContent;
        btnText.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        
        setTimeout(() => {
          btnText.textContent = originalLabel;
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    });
  </script>
</body>
</html>
