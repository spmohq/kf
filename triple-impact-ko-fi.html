<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Triple-Impact X Stylist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1f2937;
      --bg-gradient-end: #111827;
      --card-bg: rgba(31, 41, 55, 0.5);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-heading: #ffffff;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #34d399;
      --input-bg: #374151;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 850px; width: 100%; margin: 0 auto; flex-grow: 1; }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.5rem; font-weight: 700; color: var(--text-heading); letter-spacing: -1px; margin-bottom: 10px; }
    p.subtitle { font-size: 1.1rem; color: var(--text-secondary); }
    
    .prompt-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
    }

    .label-tag {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* Select Styling */
    select.mode-select {
      width: 100%;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 1rem;
      margin-bottom: 25px;
      outline: none;
      cursor: pointer;
    }

    /* Textarea Styling */
    textarea#textInput {
      width: 100%;
      min-height: 180px;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      margin-bottom: 25px;
      resize: vertical;
      outline: none;
    }
    textarea#textInput:focus { border-color: var(--accent-primary); }

    /* Preview Output */
    .prompt-preview {
      background-color: var(--code-bg);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      margin-bottom: 25px;
      max-height: 400px;
      overflow-y: auto;
    }

    /* Copy Button */
    .copy-button {
      width: 100%;
      justify-content: center;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--bg-gradient-end);
      background-color: var(--accent-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .copy-button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
    .copy-button.copied { background-color: var(--accent-success); }
    .icon { width: 20px; height: 20px; }
    .copied-icon { display: none; }
    .copy-button.copied .copy-icon { display: none; }
    .copy-button.copied .copied-icon { display: inline-block; }

    footer { padding: 40px 0; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Triple-Impact Stylist</h1>
      <p class="subtitle">Clear × Sharp × Scroll-Stopping Orientation</p>
    </header>

    <main>
      <div class="prompt-card">
        
        <label class="label-tag" for="modeSelect">1. Choose Processing Mode:</label>
        <select id="modeSelect" class="mode-select">
          <option value="REWRITE">REWRITE (Preserve exact meaning)</option>
          <option value="TRANSCREATE">TRANSCREATE (Creative adaptation/Spirit)</option>
        </select>

        <label class="label-tag" for="textInput">2. Paste Source Text:</label>
        <textarea id="textInput" placeholder="Paste the text you want to stylize here..."></textarea>

        <label class="label-tag">3. Generated AI Prompt (Preview):</label>
        <div id="promptPreview" class="prompt-preview"></div>

        <button class="copy-button" id="copyBtn">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span id="btnText">Copy Stylist Prompt</span>
        </button>
      </div>
    </main>

    <footer>
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const modeSelect = document.getElementById('modeSelect');
    const textInput = document.getElementById('textInput');
    const promptPreview = document.getElementById('promptPreview');
    const copyBtn = document.getElementById('copyBtn');
    const btnText = document.getElementById('btnText');

    const stylistRules = `Using the Triple-Impact X Style (Clear × Sharp × Scroll-Stopping), perform the selected action below.
You must apply all 10 style-guide rules with zero exceptions.

Mode selected: 
[MODE]

Apply the following 10 rules strictly:
1. Tone & Voice: Calm, grounded, honest, steady. Not energetic/aspirational.
2. Sentence Structure: Short to medium. Natural rhythm. Flow over force.
3. Reader Relationship: Address as equal. No positioning or identity elevation.
4. Lead With Orientation: Open with lived confusion or observation. Settled tone.
5. Confusion -> Clarification -> Rest: No "solution" or "payoff." Value is orientation.
6. Identity Neutrality: Do not speak to who they want to become. Speak to how it feels.
7. Titles & Headings: Plain. Honest. Accurate. Reduce curiosity.
8. Vocabulary: Use clarity, orientation, noticing, limits. Avoid scale, grow, transform.
9. Emotional Register: Relief, calm recognition. Avoid excitement or urgency.
10. Signature Style: "Nothing is being sold. This exists because it was worth writing."

One-Line Litmus Test:
If this were read slowly, in silence, by someone already tired of being convinced—would it still feel respectful?

Now apply the selected mode to the following text and provide a checklist showing how each of the 10 rules was applied:

`;

    function updatePreview() {
      const mode = modeSelect.value;
      const userText = textInput.value.trim() || "[TEXT]";
      const combined = stylistRules.replace('[MODE]', mode) + userText;
      promptPreview.textContent = combined;
    }

    // Update on interaction
    [modeSelect, textInput].forEach(el => el.addEventListener('input', updatePreview));
    
    // Initial update
    updatePreview();

    // Clipboard Logic
    copyBtn.addEventListener('click', () => {
      const finalPrompt = promptPreview.textContent;
      
      navigator.clipboard.writeText(finalPrompt).then(() => {
        const originalText = btnText.textContent;
        btnText.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        
        setTimeout(() => {
          btnText.textContent = originalText;
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });
  </script>
</body>
</html>
