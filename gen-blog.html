<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nonfiction Drafting Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #1f2937;
      --bg-gradient-end: #111827;
      --card-bg: rgba(31, 41, 55, 0.5);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-heading: #ffffff;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #34d399;
      --input-bg: #374151;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 850px; width: 100%; margin: 0 auto; flex-grow: 1; }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.5rem; font-weight: 700; color: var(--text-heading); letter-spacing: -1px; margin-bottom: 10px; }
    p.subtitle { font-size: 1.1rem; color: var(--text-secondary); }
    
    .prompt-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 25px;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    /* The Input Area */
    textarea.content-input {
      width: 100%;
      min-height: 180px;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      margin-bottom: 30px;
      transition: all 0.2s ease;
      display: block;
    }
    textarea.content-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      background-color: rgba(55, 65, 81, 0.8);
    }

    /* The Preview Area */
    .prompt-preview {
      background-color: var(--code-bg);
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      max-height: 500px;
      overflow-y: auto;
    }

    .copy-button {
      width: 100%;
      justify-content: center;
      padding: 15px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--bg-gradient-end);
      background-color: var(--accent-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .copy-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
    .copy-button.copied { background-color: var(--accent-success); }
    .icon { width: 20px; height: 20px; }
    .copied-icon { display: none; }
    .copy-button.copied .copy-icon { display: none; }
    .copy-button.copied .copied-icon { display: inline-block; }

    footer { text-align: center; margin-top: auto; padding: 40px 0; color: var(--text-secondary); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Drafting Assistant</h1>
      <p class="subtitle">Enter your idea to generate the full analysis prompt.</p>
    </header>

    <main>
      <div class="prompt-card">
        <label class="section-title" for="userInput">1. Paste Content Idea Below:</label>
        <textarea id="userInput" class="content-input" placeholder="Enter your topic, raw notes, or specific content idea here..."></textarea>

        <label class="section-title">2. Live Prompt Preview:</label>
        <div id="livePreview" class="prompt-preview"></div>

        <button class="copy-button" id="copyBtn">
          <svg class="icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
          <svg class="icon copied-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span id="btnLabel">Copy Prompt to Clipboard</span>
        </button>
      </div>
    </main>

    <footer>
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const livePreview = document.getElementById('livePreview');
    const copyBtn = document.getElementById('copyBtn');
    const btnLabel = document.getElementById('btnLabel');

    const promptTemplate = `ROLE
You are an expert nonfiction drafting assistant for public-facing blog content.

TASK
I will give you a content idea.
Your task is to generate a DRAFT-LEVEL STRUCTURE ONLY — the skeleton and the meat — so I can write the article freely.
This is for a public blog post, intended for readers who may not know the author yet.

IMPORTANT CONSTRAINTS
● This is for drafting, NOT editing
● Do NOT write the full article
● Do NOT polish wording or write final copy
● Do NOT judge quality, success, reach, or virality
● Do NOT add fluff, hype, or clickbait
● Do NOT optimize aggressively for SEO or monetization
Focus only on:
● what exists
● in what order
● and what belongs inside each part

ASSUMPTIONS ABOUT THE READER
● The reader is intelligent but unfamiliar with the author
● Some orientation and persuasion are necessary
● Persuasion here means orientation for unfamiliar readers, not motivational or behavioral pressure
● Clarity comes before depth

PLATFORM CONTEXT
Public blog (Medium, Substack, or equivalent)
● Readers may arrive via feed, search, or shared links
● Attention is limited
● Context must be earned early
● Each article must stand on its own without requiring prior reading

OUTPUT REQUIREMENTS
Follow the exact structure below.
Do not add, remove, or rename sections.

1. CORE DRAFT INTENT
● What this article is trying to explain, examine, or reframe (1–2 rough lines)
● The main question, confusion, or problem the reader likely has when opening this article

2. STRUCTURE SELECTION
From the list below, select the SINGLE most suitable structure for this idea:
● Tutorial / How-to
● Explainer
● Problem → Reframe → Insight
● Framework / Model
● Case study
● Opinion with reasoning
● Narrative analysis
State clearly:
● Selected structure:
● Why this structure best fits a public reader’s mindset (2–3 lines only)

3. HIGH-LEVEL ARTICLE FLOW (PUBLIC READER FLOW)
● Hook entry point: how the reader is drawn into the topic
● Progression: how understanding is built step by step
● Resolution point: where the article leaves the reader mentally

4. WORKING TITLE & SUBTITLE (DRAFT-ONLY)
These are internal drafting aids, not final headlines.
● Working title:
● Working subtitle (what framing, promise, or angle it signals)

5. SECTION SKELETON
Number of sections: decide based on logic, not length
For EACH section:
Section X
● Why this section exists (what the reader needs at this moment)
● Core idea or claim introduced (one rough sentence)
● Meat for this section (bullet list only):
○ explanations
○ reasoning
○ examples
○ contrasts
○ brief lists if necessary
Avoid polish. Focus on thinking order.

6. INTRODUCTION (PUBLIC-FACING, DRAFT-LEVEL)
● Situation, belief, or friction the reader is likely experiencing
● Context the reader needs before the article can proceed
● Opening line (rough, disposable)
● Intro elements to include (list only, no prose)

7. KEY INSIGHT / REFRAME CORE
(This is the intellectual payoff of the article.)
● The main insight, shift, or model being offered
● What common thinking this challenges, reframes, or improves
● What this article intentionally does not resolve or cover

8. CONCLUSION (PUBLIC-FACING, DRAFT-LEVEL)
● Where the thinking naturally lands
● What the reader now understands or sees differently
● What question, reflection, or curiosity remains open
● Conclusion elements to include (list only)

9. DRAFT READINESS CHECK
Answer briefly:
● Do I know how the reader is oriented at the start?
● Do I know how understanding progresses section by section?
● Do I know where and why the article ends?

CONTENT IDEA TO STRUCTURE

`;

    // Function to update the preview
    function updatePreview() {
      const idea = userInput.value || "[PASTE CONTENT IDEA HERE]";
      livePreview.textContent = promptTemplate + idea;
    }

    // Update on every keystroke/paste
    userInput.addEventListener('input', updatePreview);

    // Initial load
    updatePreview();

    // Copy function
    copyBtn.addEventListener('click', () => {
      const textToCopy = livePreview.textContent;
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        btnLabel.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        
        setTimeout(() => {
          btnLabel.textContent = 'Copy Prompt to Clipboard';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        // Fallback for older browsers
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        btnLabel.textContent = 'Copied!';
        setTimeout(() => { btnLabel.textContent = 'Copy Prompt to Clipboard'; }, 2000);
      });
    });
  </script>
</body>
</html>
